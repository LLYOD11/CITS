<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=0.5">
<title>CITS — Collaborative Intelligence Ticketing System</title>
<style>
:root {
  --bg: #0a0e1a; --surface: #111827; --elevated: #1f2937;
  --border: rgba(255,255,255,0.06); --text: #f3f4f6; --muted: #9ca3af;
  --accent: #6366f1; --accent-glow: rgba(99,102,241,0.3);
  --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --vip: #fbbf24;
  --t1: #3b82f6; --t2: #8b5cf6; --t3: #ec4899;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, system-ui, sans-serif; line-height: 1.6; overflow-x: hidden; }
.mesh-bg { position: fixed; inset: 0; background: radial-gradient(ellipse at 20% 80%, rgba(99,102,241,0.08) 0%, transparent 50%), radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.08) 0%, transparent 50%), radial-gradient(ellipse at 50% 50%, rgba(6,182,212,0.05) 0%, transparent 70%); pointer-events: none; z-index: 0; }
.app { position: relative; z-index: 1; display: flex; min-height: 100vh; }
.sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
.logo { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
.logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; box-shadow: 0 0 20px var(--accent-glow); }
.logo-text { font-weight: 700; font-size: 1.25rem; letter-spacing: -0.02em; }
.logo-sub { font-size: 0.625rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.nav-item { display: flex; align-items: center; gap: 0.875rem; padding: 0.75rem 1rem; border-radius: 10px; cursor: pointer; transition: all 0.2s; color: var(--muted); font-size: 0.9375rem; position: relative; }
.nav-item:hover { background: rgba(255,255,255,0.03); color: var(--text); }
.nav-item.active { background: rgba(99,102,241,0.1); color: var(--accent); }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 20px; background: var(--accent); border-radius: 0 4px 4px 0; }
.nav-badge { margin-left: auto; background: var(--danger); color: white; font-size: 0.6875rem; padding: 0.125rem 0.5rem; border-radius: 999px; font-weight: 600; }
.team-presence { margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--border); }
.presence-title { font-size: 0.6875rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.75rem; }
.presence-item { display: flex; align-items: center; gap: 0.625rem; padding: 0.375rem 0; font-size: 0.8125rem; }
.presence-dot { width: 8px; height: 8px; border-radius: 50%; position: relative; }
.presence-dot::after { content: ''; position: absolute; inset: -2px; border-radius: 50%; animation: pulse-ring 2s infinite; }
.presence-dot.online { background: var(--success); }
.presence-dot.online::after { border: 2px solid var(--success); }
.presence-dot.busy { background: var(--danger); }
.presence-dot.away { background: var(--warning); }
@keyframes pulse-ring { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
.main { flex: 1; padding: 2rem; overflow-y: auto; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
.greeting h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.25rem; }
.greeting p { color: var(--muted); font-size: 0.9375rem; }
.top-actions { display: flex; gap: 0.75rem; align-items: center; }
.btn { padding: 0.625rem 1.25rem; border-radius: 10px; border: 1px solid var(--border); background: var(--elevated); color: var(--text); cursor: pointer; font-size: 0.875rem; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
.btn:hover { background: rgba(255,255,255,0.05); transform: translateY(-1px); }
.btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; box-shadow: 0 4px 15px var(--accent-glow); }
.btn-primary:hover { box-shadow: 0 6px 25px var(--accent-glow); }
.btn-sm { padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.8125rem; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.btn-sm:hover { background: rgba(255,255,255,0.05); }
.btn-sm.primary { background: var(--accent); border-color: var(--accent); }
.btn-sm.primary:hover { background: #4f46e5; }
.intel-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.25rem; margin-bottom: 2rem; }
.intel-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; position: relative; overflow: hidden; transition: all 0.3s; }
.intel-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.intel-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.1); }
.intel-card.vip::before { background: linear-gradient(135deg, #f59e0b, #ef4444); }
.intel-card.team::before { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
.intel-card.efficiency::before { background: linear-gradient(135deg, #3b82f6, #06b6d4); }
.intel-card.collab::before { background: linear-gradient(90deg, var(--success), var(--accent)); }
.intel-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.75rem; }
.intel-value { font-size: 2.25rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
.intel-trend { font-size: 0.8125rem; display: flex; align-items: center; gap: 0.375rem; }
.trend-up { color: var(--success); }
.section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
.section-title { font-size: 1.125rem; font-weight: 600; display: flex; align-items: center; gap: 0.625rem; }
.section-title .icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
.filter-tabs { display: flex; gap: 0.25rem; background: rgba(255,255,255,0.03); padding: 0.25rem; border-radius: 10px; }
.filter-tab { padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.8125rem; cursor: pointer; transition: all 0.2s; color: var(--muted); }
.filter-tab.active { background: var(--elevated); color: var(--text); font-weight: 500; }
.ticket { display: grid; grid-template-columns: auto 1fr auto auto; gap: 1.25rem; align-items: center; padding: 1.25rem; border-radius: 12px; margin-bottom: 0.75rem; background: rgba(255,255,255,0.02); border: 1px solid transparent; transition: all 0.3s; position: relative; }
.ticket:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.08); }
.ticket.vip-escalation { border-color: rgba(251,191,36,0.2); background: linear-gradient(90deg, rgba(251,191,36,0.03), transparent); }
.ticket-priority { width: 4px; height: 100%; border-radius: 2px; position: absolute; left: 0; top: 0; bottom: 0; }
.priority-p0 { background: var(--danger); box-shadow: 0 0 10px rgba(239,68,68,0.4); }
.priority-p1 { background: var(--warning); }
.priority-p2 { background: var(--accent); }
.priority-p3 { background: var(--muted); }
.ticket-info { min-width: 0; }
.ticket-title { font-weight: 600; font-size: 0.9375rem; margin-bottom: 0.375rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.ticket-meta { display: flex; gap: 1rem; font-size: 0.8125rem; color: var(--muted); flex-wrap: wrap; }
.tag { padding: 0.25rem 0.625rem; border-radius: 6px; font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
.tag-vip { background: rgba(251,191,36,0.15); color: var(--vip); border: 1px solid rgba(251,191,36,0.2); }
.tag-tier { background: rgba(59,130,246,0.15); color: var(--t1); }
.tag-auto { background: rgba(16,185,129,0.15); color: var(--success); }
.tag-context { background: rgba(139,92,246,0.15); color: #c4b5fd; }
.ticket-context { max-width: 300px; font-size: 0.8125rem; color: var(--muted); background: rgba(99,102,241,0.05); padding: 0.75rem; border-radius: 8px; border-left: 2px solid var(--accent); }
.ticket-context strong { color: var(--text); display: block; margin-bottom: 0.25rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
.ticket-actions { display: flex; gap: 0.5rem; }
.collab-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.collab-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; }
.collab-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; }
.collab-avatar { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1rem; position: relative; }
.collab-avatar.t1 { background: linear-gradient(135deg, #3b82f6, #06b6d4); }
.collab-avatar.t2 { background: linear-gradient(135deg, #8b5cf6, #ec4899); }
.tier-badge { position: absolute; bottom: -4px; right: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 2px solid var(--bg); display: flex; align-items: center; justify-content: center; font-size: 0.625rem; font-weight: 800; }
.collab-name { font-weight: 600; }
.collab-role { font-size: 0.75rem; color: var(--muted); }
.context-gathered { background: rgba(16,185,129,0.05); border: 1px solid rgba(16,185,129,0.15); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
.context-gathered h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--success); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
.context-item { display: flex; align-items: center; gap: 0.625rem; font-size: 0.8125rem; color: var(--muted); padding: 0.375rem 0; }
.context-item::before { content: '✓'; color: var(--success); font-weight: 700; }
.handoff-preview { background: rgba(99,102,241,0.05); border: 1px dashed rgba(99,102,241,0.3); border-radius: 10px; padding: 1rem; text-align: center; }
.handoff-preview p { font-size: 0.8125rem; color: var(--muted); margin-bottom: 0.75rem; }
.team-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
.member-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem; transition: all 0.3s; position: relative; overflow: hidden; }
.member-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.1); }
.member-header { display: flex; align-items: center; gap: 0.875rem; margin-bottom: 1rem; }
.member-avatar { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.125rem; position: relative; }
.member-status { position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--surface); }
.status-available { background: var(--success); }
.status-busy { background: var(--danger); }
.status-focus { background: var(--warning); }
.member-info h4 { font-weight: 600; font-size: 0.9375rem; }
.member-info p { font-size: 0.75rem; color: var(--muted); }
.skill-cloud { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-bottom: 1rem; }
.skill-chip { padding: 0.25rem 0.625rem; border-radius: 6px; font-size: 0.6875rem; background: rgba(255,255,255,0.05); color: var(--muted); transition: all 0.2s; }
.skill-chip.expert { background: rgba(99,102,241,0.15); color: #a5b4fc; }
.skill-chip.growing { background: rgba(16,185,129,0.1); color: #6ee7b7; }
.workload-bar { margin-bottom: 1rem; }
.workload-header { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.375rem; }
.bar-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; position: relative; }
.bar-fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); animation: shimmer 2s infinite; }
@keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.bar-fill.low { background: var(--success); }
.bar-fill.medium { background: var(--warning); }
.bar-fill.high { background: var(--danger); }
.ai-suggestion { background: linear-gradient(135deg, rgba(99,102,241,0.08), rgba(139,92,246,0.08)); border: 1px solid rgba(99,102,241,0.15); border-radius: 10px; padding: 0.875rem; font-size: 0.8125rem; }
.ai-suggestion strong { color: #a5b4fc; display: block; margin-bottom: 0.25rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; }
.trust-banner { background: linear-gradient(135deg, rgba(16,185,129,0.08), rgba(6,182,212,0.08)); border: 1px solid rgba(16,185,129,0.15); border-radius: 16px; padding: 1.25rem 1.5rem; display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
.trust-icon { width: 48px; height: 48px; background: rgba(16,185,129,0.15); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
.trust-text h3 { font-size: 0.9375rem; font-weight: 600; margin-bottom: 0.25rem; }
.trust-text p { font-size: 0.8125rem; color: var(--muted); }
.toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 1000; display: flex; flex-direction: column; gap: 0.75rem; }
.toast { background: var(--elevated); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem; display: flex; align-items: center; gap: 0.875rem; box-shadow: 0 10px 40px rgba(0,0,0,0.4); animation: slideInRight 0.4s ease; max-width: 400px; }
@keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.toast-icon { font-size: 1.25rem; }
.toast-content { flex: 1; }
.toast-title { font-weight: 600; font-size: 0.875rem; margin-bottom: 0.125rem; }
.toast-desc { font-size: 0.75rem; color: var(--muted); }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.modal-overlay.active { opacity: 1; pointer-events: all; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; width: 90%; max-width: 600px; transform: scale(0.95); transition: transform 0.3s; }
.modal-overlay.active .modal { transform: scale(1); }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
.modal-title { font-size: 1.25rem; font-weight: 700; }
.close-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.input-field { width: 100%; padding: 0.75rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.9375rem; margin-bottom: 1rem; }
.input-field:focus { outline: none; border-color: var(--accent); }
.select-field { width: 100%; padding: 0.75rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.9375rem; margin-bottom: 1rem; cursor: pointer; }
.select-field:focus { outline: none; border-color: var(--accent); }
.loading { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { text-align: center; padding: 3rem; color: var(--muted); }
.empty-state-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
.insight-item { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.75rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.insight-item:last-child { border-bottom: none; }
.insight-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1rem; }
.insight-icon.success { background: rgba(16,185,129,0.15); }
.insight-icon.warning { background: rgba(245,158,11,0.15); }
.insight-icon.info { background: rgba(99,102,241,0.15); }
.insight-title { font-weight: 600; font-size: 0.875rem; }
.insight-desc { font-size: 0.75rem; color: var(--muted); }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
@media (max-width: 1200px) { .intel-grid { grid-template-columns: repeat(2, 1fr); } .team-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 768px) { .sidebar { display: none; } .intel-grid { grid-template-columns: 1fr; } .collab-panel { grid-template-columns: 1fr; } .team-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="mesh-bg"></div>
<div class="app">
<aside class="sidebar">
<div class="logo">
<div class="logo-icon">🎯</div>
<div><div class="logo-text">CITS</div><div class="logo-sub">Collaborative Intelligence</div></div>
</div>
<nav>
<div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')"><span>📊</span><span>Command Center</span><span class="nav-badge" id="navBadge">0</span></div>
<div class="nav-item" data-page="queue" onclick="navigate('queue')"><span>🎫</span><span>Smart Queue</span></div>
<div class="nav-item" data-page="team" onclick="navigate('team')"><span>👥</span><span>Team Hub</span></div>
<div class="nav-item" data-page="collab" onclick="navigate('collab')"><span>🤝</span><span>Collaboration</span><span class="nav-badge" id="collabBadge" style="background: var(--warning);">0</span></div>
</nav>
<div class="team-presence">
<div class="presence-title">Team Presence</div>
<div id="presenceList"></div>
</div>
</aside>
<main class="main" id="mainContent"></main>
</div>
<div class="toast-container" id="toastContainer"></div>
<div class="modal-overlay" id="modal">
<div class="modal">
<div class="modal-header">
<div class="modal-title">🎫 Create New Ticket</div>
<button class="close-btn" onclick="closeModal()">✕</button>
</div>
<p style="color: var(--muted); margin-bottom: 1rem;">CITS will auto-gather context and suggest the best assignment.</p>
<div style="display: flex; flex-direction: column; gap: 0.5rem;">
<input type="text" id="ticketTitle" class="input-field" placeholder="Ticket title...">
<select id="ticketPriority" class="select-field">
<option value="p3">P3 — Low (8h SLA)</option>
<option value="p2">P2 — Medium (4h SLA)</option>
<option value="p1">P1 — High (1h SLA)</option>
<option value="p0">P0 — Critical (30min SLA)</option>
</select>
<select id="ticketCategory" class="select-field">
<option value="General">Select category...</option>
<option value="Infrastructure">Infrastructure</option>
<option value="Database">Database</option>
<option value="Security">Security</option>
<option value="Auth">Auth</option>
<option value="Performance">Performance</option>
<option value="API">API</option>
<option value="Backend">Backend</option>
</select>
<select id="ticketClient" class="select-field">
<option value="">Select client...</option>
</select>
<button class="btn btn-primary" style="justify-content: center; margin-top: 0.5rem;" onclick="submitTicket()">
<span id="submitSpinner" style="display:none;" class="loading"></span>
<span id="submitText">Create & Auto-Route</span>
</button>
</div>
</div>
</div>
<script>

const API_BASE = window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1') ? 'http://localhost:8000' : window.location.origin;
let currentPage = 'dashboard';
let clients = [];
let team = [];
let queue = [];
let stats = {};

async function api(endpoint, options = {}) {
    const res = await fetch(`${API_BASE}${endpoint}`, {
        headers: { 'Content-Type': 'application/json', ...options.headers },
        ...options
    });
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
    }
    return res.json();
}

function showToast(icon, title, desc) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = `<span class="toast-icon">${icon}</span><div class="toast-content"><div class="toast-title">${title}</div><div class="toast-desc">${desc}</div></div>`;
    container.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; setTimeout(() => toast.remove(), 300); }, 4000);
}

function openModal() { document.getElementById('modal').classList.add('active'); }
function closeModal() { document.getElementById('modal').classList.remove('active'); }

async function loadClients() {
    clients = await api('/clients/');
    const select = document.getElementById('ticketClient');
    select.innerHTML = '<option value="">Select client...</option>' + clients.map(c => `<option value="${c.id}">${c.name} (${c.tier})</option>`).join('');
}

async function submitTicket() {
    const title = document.getElementById('ticketTitle').value;
    const priority = document.getElementById('ticketPriority').value;
    const category = document.getElementById('ticketCategory').value;
    const clientId = document.getElementById('ticketClient').value;
    if (!title) { showToast('⚠️', 'Title required', 'Please enter a ticket title'); return; }
    document.getElementById('submitSpinner').style.display = 'inline-block';
    document.getElementById('submitText').textContent = 'Creating...';
    try {
        const payload = { title, priority, category };
        if (clientId) payload.client_id = parseInt(clientId);
        const ticket = await api('/tickets/', { method: 'POST', body: JSON.stringify(payload) });
        closeModal();
        showToast('✨', 'Ticket Created', `CITS auto-assigned to best match. Ticket #${ticket.id}`);
        document.getElementById('ticketTitle').value = '';
        await loadData();
        renderPage();
    } catch (e) {
        showToast('❌', 'Error', e.message);
    } finally {
        document.getElementById('submitSpinner').style.display = 'none';
        document.getElementById('submitText').textContent = 'Create & Auto-Route';
    }
}

async function resolveTicket(id) {
    try {
        await api(`/tickets/${id}/resolve`, { method: 'POST', body: '{}' });
        showToast('✅', 'Ticket Resolved', 'Great work! Skills updated automatically.');
        await loadData();
        renderPage();
    } catch (e) { showToast('❌', 'Error', e.message); }
}

async function compileContext(ticketId, toId, byId) {
    try {
        await api(`/tickets/${ticketId}/context`, {
            method: 'POST',
            body: JSON.stringify({ ticket_id: ticketId, assigned_to: toId, assigned_by: byId })
        });
        showToast('📦', 'Context Compiled', 'Package ready for T2 handoff.');
        await loadData();
        renderPage();
    } catch (e) { showToast('❌', 'Error', e.message); }
}

async function handoffTicket(ticketId, fromId, toId) {
    try {
        await api(`/tickets/${ticketId}/handoff`, {
            method: 'POST',
            body: JSON.stringify({ ticket_id: ticketId, from_user_id: fromId, to_user_id: toId, reason: 'Collaboration handoff' })
        });
        showToast('🤝', 'Handoff Complete', 'Context transferred successfully.');
        await loadData();
        renderPage();
    } catch (e) { showToast('❌', 'Error', e.message); }
}

function timeAgo(iso) {
    const date = new Date(iso);
    const now = new Date();
    const seconds = Math.floor((now - date) / 1000);
    if (seconds < 60) return `${seconds}s ago`;
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    return `${Math.floor(hours / 24)}d ago`;
}

function getLoadColor(load, max) {
    const ratio = load / max;
    if (ratio < 0.5) return 'low';
    if (ratio < 0.8) return 'medium';
    return 'high';
}

function getStatusDot(status) {
    const map = { available: 'online', busy: 'busy', focus: 'away', away: 'away' };
    return map[status] || 'online';
}

function navigate(page) {
    currentPage = page;
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.querySelector(`[data-page="${page}"]`).classList.add('active');
    renderPage();
}

async function loadData() {
    try {
        [stats, queue, team, clients] = await Promise.all([
            api('/dashboard/stats'),
            api('/dashboard/queue'),
            api('/dashboard/team'),
            api('/clients/')
        ]);
        document.getElementById('navBadge').textContent = stats.at_risk_count || 0;
        document.getElementById('collabBadge').textContent = stats.collaboration_events || 0;
        renderPresence();
    } catch (e) {
        console.error('Load error:', e);
        showToast('⚠️', 'Connection Issue', 'Could not load dashboard data. Retrying...');
    }
}

function renderPresence() {
    const list = document.getElementById('presenceList');
    list.innerHTML = team.map(u => `
        <div class="presence-item">
            <span class="presence-dot ${getStatusDot(u.status)}"></span>
            <span>${u.name} — ${u.status === 'busy' ? 'At capacity' : u.status}</span>
        </div>
    `).join('');
}

function renderTicket(t) {
    const isVip = t.client_tier === 'vip' || t.client_tier === 'enterprise';
    const vipClass = isVip ? 'vip-escalation' : '';
    const tags = [];
    if (isVip) tags.push('<span class="tag tag-vip">VIP</span>');
    if (t.handoff_from) tags.push('<span class="tag tag-tier">HANDOFF</span>');
    if (t.context_compiled) tags.push('<span class="tag tag-context">CONTEXT READY</span>');

    let contextHtml = '<div class="ticket-context"><strong>⏳ Gathering Context...</strong></div>';
    if (t.auto_context && Object.keys(t.auto_context).length > 0) {
        const ctx = t.auto_context;
        let items = '';
        if (ctx.logs) items += `<div class="context-item">${ctx.logs.application || 'Logs attached'}</div>`;
        if (ctx.client_history) items += `<div class="context-item">Client: ${ctx.client_history.tier} (${ctx.client_history.recent_tickets} recent)</div>`;
        if (ctx.related_incidents) items += `<div class="context-item">${ctx.related_incidents.length} related incidents</div>`;
        contextHtml = `<div class="ticket-context"><strong>🤖 Auto-Gathered Context</strong><div style="margin-top:0.5rem">${items}</div></div>`;
    }

    const actions = [];
    if (t.status !== 'resolved') {
        actions.push(`<button class="btn-sm primary" onclick="resolveTicket(${t.id})">✓ Resolve</button>`);
    }
    if (!t.context_compiled && t.priority === 'p1' && !t.handoff_to && t.assignee_id) {
        const partner = team.find(u => u.id !== t.assignee_id && u.status === 'available' && u.current_load < 3);
        if (partner) {
            actions.push(`<button class="btn-sm" onclick="compileContext(${t.id}, ${partner.id}, ${t.assignee_id})">📦 Compile Context</button>`);
        }
    }
    if (t.assignee_id && !t.handoff_to && t.status !== 'resolved') {
        const t2Users = team.filter(u => u.tier === 't2' && u.id !== t.assignee_id);
        if (t2Users.length > 0) {
            actions.push(`<button class="btn-sm" onclick="handoffTicket(${t.id}, ${t.assignee_id}, ${t2Users[0].id})">🤝 Handoff to T2</button>`);
        }
    }

    return `
    <div class="ticket ${vipClass}">
    <div class="ticket-priority priority-${t.priority}"></div>
    <div class="ticket-info">
    <div class="ticket-title"><span>${t.title}</span>${tags.join('')}</div>
    <div class="ticket-meta">
    <span>🕐 ${timeAgo(t.created_at)}</span>
    <span>📍 ${t.client_name}</span>
    <span>🏷️ ${t.category}</span>
    <span>👤 ${t.assignee_name}</span>
    </div>
    </div>
    ${contextHtml}
    <div class="ticket-actions">${actions.join('')}</div>
    </div>`;
}

function renderMember(m) {
    const skills = (m.skills || []).map(s => {
        const cls = s.level === 'expert' ? 'expert' : (s.level === 'growing' ? 'growing' : '');
        return `<span class="skill-chip ${cls}">${s.name} (${s.count}x)</span>`;
    }).join('');
    const loadColor = getLoadColor(m.current_load, m.max_capacity);
    const loadPct = Math.round((m.current_load / m.max_capacity) * 100);

    let suggestion = '';
    if (m.current_load >= m.max_capacity) {
        suggestion = `<div class="ai-suggestion"><strong>⚠️ At Capacity</strong>Consider redistributing ${m.name}'s workload to maintain team flow.</div>`;
    } else if (m.skills && m.skills.some(s => s.level === 'expert')) {
        const expertSkill = m.skills.find(s => s.level === 'expert');
        suggestion = `<div class="ai-suggestion"><strong>🎯 Expert Match</strong>${m.name} has ${expertSkill.count} ${expertSkill.name} resolutions. Routing matching tickets reduces breach risk by ~70%.</div>`;
    } else if (m.skills && m.skills.some(s => s.level === 'growing')) {
        const growSkill = m.skills.find(s => s.level === 'growing');
        suggestion = `<div class="ai-suggestion"><strong>📈 Growth Path</strong>${m.name} is building ${growSkill.name} expertise. Assigning matching tickets accelerates skill development.</div>`;
    }

    return `
    <div class="member-card">
    <div class="member-header">
    <div class="member-avatar" style="background: linear-gradient(135deg, ${m.tier === 't2' ? '#8b5cf6, #ec4899' : (m.tier === 't3' ? '#ec4899, #f59e0b' : '#3b82f6, #06b6d4')}">
    ${m.avatar_initials}
    <span class="member-status status-${m.status === 'available' ? 'available' : (m.status === 'busy' ? 'busy' : 'focus')}"></span>
    </div>
    <div class="member-info">
    <h4>${m.name}</h4>
    <p>${m.tier.toUpperCase()} • ${m.role} • ${m.efficiency_score}% efficiency</p>
    </div>
    </div>
    <div class="skill-cloud">${skills}</div>
    <div class="workload-bar">
    <div class="workload-header"><span>Current Load</span><span>${m.current_load}/${m.max_capacity}</span></div>
    <div class="bar-track"><div class="bar-fill ${loadColor}" style="width: ${loadPct}%"></div></div>
    </div>
    ${suggestion}
    </div>`;
}

    const iconClass = i.type === 'success' ? 'success' : (i.type === 'warning' ? 'warning' : 'info');
    return `

function renderCollabPage() {

function renderPage() {
    const main = document.getElementById('mainContent');
    if (currentPage === 'dashboard') main.innerHTML = renderDashboard();
    else if (currentPage === 'queue') main.innerHTML = renderQueuePage();
    else if (currentPage === 'team') main.innerHTML = renderTeamPage();
    else if (currentPage === 'collab') main.innerHTML = renderCollabPage();
}

function filterQueue(type) {
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    let filtered = queue;
    if (type === 'urgent') filtered = queue.filter(t => t.priority === 'p0' || t.priority === 'p1');
    if (type === 'handoff') filtered = queue.filter(t => t.handoff_from);
    document.getElementById('queueList').innerHTML = filtered.map(t => renderTicket(t)).join('');
}

// Initialize
async function init() {
    await loadClients();
    await loadData();
    renderPage();
    setInterval(async () => {
        await loadData();
        if (currentPage === 'dashboard') renderPage();
    }, 30000);
}

init();
</script>
